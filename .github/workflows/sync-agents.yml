name: 지침 동기화

# 공통 지침이 바뀌면 대상 저장소에 동기화 PR을 연다.
# 대상 저장소에 쓰려면 SYNC_TOKEN(다른 저장소 contents·pull-requests 쓰기)이 필요하다.
# 기본 GITHUB_TOKEN은 자기 저장소에만 쓸 수 있다.

on:
  push:
    branches: [main]
    paths:
      - 'instructions/**'
      - 'xcode/xcconfig-precedence.md'
      - 'sync-targets.json'
      - 'bin/**'
      - '.github/workflows/sync-agents.yml'
  pull_request:
    paths:
      - 'instructions/**'
      - 'xcode/xcconfig-precedence.md'
      - 'sync-targets.json'
      - 'bin/**'
  workflow_dispatch:
    inputs:
      target:
        description: '한 대상만 돌린다 (비우면 전체)'
        required: false

permissions:
  contents: read

jobs:
  검증:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover
      - run: python3 bin/sync-agents.py --validate

  대상목록:
    needs: 검증
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        env:
          ONLY: ${{ inputs.target }}
        run: |
          python3 bin/sync-agents.py --ci-matrix > all.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open('all.json'))
          only = os.environ.get('ONLY', '').strip()
          if only:
              data['include'] = [t for t in data['include'] if t['id'] == only]
              if not data['include']:
                  raise SystemExit(f'CI 대상이 아니거나 알 수 없는 id: {only}')
          print('matrix=' + json.dumps(data))
          print('count=' + str(len(data['include'])))
          PY

  동기화:
    needs: 대상목록
    if: needs.대상목록.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 한 저장소가 막혀도 나머지는 계속한다
      max-parallel: 4
      matrix: ${{ fromJson(needs.대상목록.outputs.matrix) }}
    steps:
      - name: 원본 받기
        uses: actions/checkout@v4
        with:
          path: knowledge

      - name: 대상 받기
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.default_branch }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target

      - name: 지침 심기
        id: sync
        run: |
          python3 knowledge/bin/sync-agents.py \
            --source knowledge \
            --target "${{ matrix.id }}" \
            --target-root target
          cd target
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — PR을 열지 않는다"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          fi

      - name: PR 열기
        if: steps.sync.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BRANCH: chore/knowledge-sync
          BASE: ${{ matrix.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  'knowledge-sync'
          git config user.email 'knowledge-sync@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- AGENTS.md CLAUDE.md .agent-instructions
          git commit -m "docs: 공통 지침 관리 블록을 갱신한다

원본 ${{ github.repository }}@${{ github.sha }}에서 생성했다.
관리 블록과 .agent-instructions/는 직접 편집하지 않는다."
          # 이미 열린 동기화 브랜치가 있으면 그 위에 덮는다
          git push --force-with-lease origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "기존 PR을 갱신했다"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title '공통 지침 동기화' \
              --body "$(printf '%s\n' \
                '`studio-artifakt/knowledge`의 공통 지침이 바뀌어 관리 블록을 다시 심었다.' \
                '' \
                "원본 커밋: ${{ github.repository }}@${{ github.sha }}" \
                '' \
                '`AGENTS.md`의 `knowledge:begin`~`knowledge:end` 사이와' \
                '`.agent-instructions/`는 생성물이다. 직접 고치면 다음 동기화가 충돌로 멈춘다.' \
                '고칠 것이 있으면 원본 저장소에서 고친다.')"
          fi
